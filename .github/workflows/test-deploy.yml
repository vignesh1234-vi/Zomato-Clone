name: Test Deployment

on:
  push:
    branches-ignore:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Generate Image Tag
        run: |
          echo "IMAGE_TAG=test-$(date +'%d%m%Y-%H%M%S')-${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Build Docker Image
        run: |
          docker build -t myapp-test:${IMAGE_TAG} .

      - name: Stop Existing Test Container
        run: |
          docker stop myapp-test || true
          docker rm myapp-test || true

      - name: Run Test Container
        run: |
          docker run -d \
            --name myapp-test \
            -p 8080:80 \
            myapp-test:${IMAGE_TAG}

      - name: Verify Deployment
        run: docker ps
