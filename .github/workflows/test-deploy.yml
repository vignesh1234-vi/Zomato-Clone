name: Deploy Test

on:
  push:
    branches-ignore:
      - main

jobs:
  deploy-test:
    runs-on: ubuntu-latest
    environment: test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Determine Active Slot
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            ACTIVE_SLOT=$(cat /home/ubuntu/zomato-test/active.txt 2>/dev/null || echo blue)

            if [ "$ACTIVE_SLOT" = "blue" ]; then
              echo "Deploying to green"
            else
              echo "Deploying to blue"
            fi

      - name: Pull Latest Code
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/zomato-test
            git fetch origin
            git reset --hard origin/${{ github.ref_name }}

      - name: Build Docker Image
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/zomato-test

            TIMESTAMP=$(date +%d%m%Y-%H%M%S)
            COMMIT=$(git rev-parse --short HEAD)

            docker build -t zomato-test:${TIMESTAMP}-${COMMIT} .

      - name: Deploy Inactive Slot
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            ACTIVE_SLOT=$(cat /home/ubuntu/zomato-test/active.txt)

            if [ "$ACTIVE_SLOT" = "blue" ]; then
              NEW_SLOT=green
              NEW_PORT=3102
            else
              NEW_SLOT=blue
              NEW_PORT=3101
            fi

            docker rm -f zomato-test-$NEW_SLOT || true

            IMAGE=$(docker images zomato-test --format "{{.Repository}}:{{.Tag}}" | sort -r | head -1)

            docker run -d \
              --restart unless-stopped \
              --name zomato-test-$NEW_SLOT \
              -p ${NEW_PORT}:80 \
              $IMAGE

      - name: Health Check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            ACTIVE_SLOT=$(cat /home/ubuntu/zomato-test/active.txt)

            if [ "$ACTIVE_SLOT" = "blue" ]; then
              NEW_PORT=3102
            else
              NEW_PORT=3101
            fi

            sleep 15

            curl -f http://127.0.0.1:${NEW_PORT}

      - name: Switch NGINX
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            ACTIVE_SLOT=$(cat /home/ubuntu/zomato-test/active.txt)

            if [ "$ACTIVE_SLOT" = "blue" ]; then
              OLD_PORT=3101
              NEW_PORT=3102
            else
              OLD_PORT=3102
              NEW_PORT=3101
            fi

            sudo sed -i "s/127.0.0.1:${OLD_PORT}/127.0.0.1:${NEW_PORT}/g" /etc/nginx/sites-available/zomato-test.conf

            sudo nginx -t
            sudo systemctl reload nginx

      - name: Update Metadata
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            ACTIVE_SLOT=$(cat /home/ubuntu/zomato-test/active.txt)

            if [ "$ACTIVE_SLOT" = "blue" ]; then
              NEW_SLOT=green
            else
              NEW_SLOT=blue
            fi

            echo "$NEW_SLOT" > /home/ubuntu/zomato-test/active.txt

            cat > /home/ubuntu/zomato-test/current-release.txt <<EOF
            BRANCH=${{ github.ref_name }}
            SLOT=$NEW_SLOT
            ACTION=DEPLOY
            DEPLOYED_AT=$(date)
            EOF

      - name: Send Email
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cat /home/ubuntu/zomato-test/current-release.txt | mail -s "Zomato Test Deployment Updated" vigneshm@datatemplate.com,vaishnavins@datatemplate.com
