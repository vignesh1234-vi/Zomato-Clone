name: Test and Production Deployment

on:
  push:
    branches:
      - '**'

jobs:

  deploy-test:
    runs-on: [self-hosted, docker]

    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deployment Details
        run: |
          echo "Branch Name : ${{ github.ref_name }}"
          echo "Commit ID   : ${GITHUB_SHA::7}"
          echo "Environment : TEST"

      - name: Generate Image Tag
        id: tag
        run: |
          TAG=$(date +'%Y%m%d-%H%M%S')-${GITHUB_SHA::7}
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "image_tag=$TAG" >> $GITHUB_OUTPUT

      - name: Build Test Image
        run: |
          docker build -t myapp:${TAG} .

      - name: Backup Existing Test Container
        run: |
          docker stop myapp-test || true
          docker rename myapp-test myapp-test-backup || true

      - name: Start New Test Container
        run: |
          docker run -d \
            --name myapp-test \
            -p 8081:80 \
            myapp:${TAG}

      - name: Health Check
        run: |
          sleep 20
          curl -f http://localhost:8081

      - name: Remove Backup Container
        if: success()
        run: |
          docker rm -f myapp-test-backup || true

      - name: Rollback Test
        if: failure()
        run: |
          docker rm -f myapp-test || true
          docker rename myapp-test-backup myapp-test || true
          docker start myapp-test || true

  deploy-prod:
    needs: deploy-test
    runs-on: [self-hosted, docker]

    environment:
      name: production

    steps:
      - name: Deployment Details
        run: |
          echo "Environment : PROD"
          echo "Image Tag   : ${{ needs.deploy-test.outputs.image_tag }}"

      - name: Backup Existing Production Container
        run: |
          docker stop myapp-prod || true
          docker rename myapp-prod myapp-prod-backup || true

      - name: Start Production Container
        run: |
          docker run -d \
            --name myapp-prod \
            -p 80:80 \
            myapp:${{ needs.deploy-test.outputs.image_tag }}

      - name: Health Check
        run: |
          sleep 20
          curl -f http://localhost

      - name: Remove Backup Container
        if: success()
        run: |
          docker rm -f myapp-prod-backup || true

      - name: Rollback Production
        if: failure()
        run: |
          docker rm -f myapp-prod || true
          docker rename myapp-prod-backup myapp-prod || true
          docker start myapp-prod || true
